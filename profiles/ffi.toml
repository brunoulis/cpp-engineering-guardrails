[profile]
name = "ffi"
description = "C/C++ native ABI and boundaries with Rust, Dart/Flutter or foreign runtimes"
[gates]
require_build = true
require_tests = true
require_lint = false
require_asan_ubsan = false
require_tsan = false
require_abi = false # require binary ABI checks if exported shared library actually has old/new artifacts
require_benchmark = false
[review]
block_heuristic_p2 = false
require_independent_review = true
[context]
inspect = ["C ABI", "ownership", "buffer length", "allocation/free", "exception boundaries", "thread affinity", "consumer tests", "ABI versions"]
