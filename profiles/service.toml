[profile]
name = "service"
description = "C++ backend, APIs, storage, queues and asynchronous workers"
[gates]
require_build = true
require_tests = true
require_lint = false
require_asan_ubsan = false
require_tsan = false
require_abi = false
require_benchmark = false
[review]
block_heuristic_p2 = false
require_independent_review = true
[context]
inspect = ["bounded memory", "backpressure", "idempotency", "cancellation", "timeouts", "shutdown", "security"]
