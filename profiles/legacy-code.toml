[profile]
name = "legacy-code"
description = "Incremental migration, behavior characterization, no forced modernization"

[gates]
require_build = true
require_tests = false
require_lint = false
require_asan_ubsan = false
require_tsan = false
require_abi = false
require_benchmark = false

[review]
block_new_p0 = true
block_new_p1 = true
block_heuristic_p2 = false
require_independent_review = true

[migration]
require_characterization_tests = true
prefer_adapter_seams = true
forbid_unsolicited_full_reformat = true
